<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Plugin Simulator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #eef0f4;
        color: #23262f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .sim {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      .plugin-window {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

    </style>
  </head>
  <body>
    <main class="sim">
      <section class="plugin-window" aria-label="插件窗口">
        <iframe src="./dist/ui.html" title="Image To Slice plugin"></iframe>
      </section>

    </main>

    <script src="./dist/figma-sim.js"></script>
  </body>
</html>
